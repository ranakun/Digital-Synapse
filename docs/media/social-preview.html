<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Synapse — social preview artwork</title>
<style>
@font-face{font-family:Plex;src:url('../../src/synapse/static/fonts/IBMPlexSans-Regular.woff2')}
@font-face{font-family:Plex;src:url('../../src/synapse/static/fonts/IBMPlexSans-SemiBold.woff2');font-weight:600}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{font-family:Plex,sans-serif;background:#141416;color:#f3f2f4}
main{position:relative;width:100%;height:100%;padding:52px 56px}
.eyebrow{margin:0;color:#a9b9d0;font-size:14px;letter-spacing:2px;font-weight:600;text-transform:uppercase}
h1{font-size:70px;line-height:1.04;letter-spacing:-2.8px;font-weight:600;margin:32px 0 24px}
.description{font-size:25px;line-height:1.4;max-width:460px;color:#c8c7d0;margin:0}
.features{font-size:16px;color:#aba9b6;margin-top:26px}
figure{position:absolute;left:614px;top:111px;width:610px;margin:0}
.frame{border:1px solid #3a3a43;border-radius:12px;overflow:hidden;background:#141416;box-shadow:0 24px 64px #0005}
img{display:block;width:608px;height:auto}
figcaption{font-size:13px;color:#92909e;text-align:right;margin-top:12px}
footer{position:absolute;bottom:42px;left:56px;right:56px;border-top:1px solid #323139;padding-top:20px;display:flex;justify-content:space-between;font-size:15px;color:#aaa8b4}
footer strong{font-weight:400;color:#d3d1db}
</style>
<main>
<p class="eyebrow">Open source · Personal knowledge</p>
<h1>Digital<br>Synapse</h1>
<p class="description">A knowledge workspace for<br>you and your AI agents.</p>
<p class="features">Connect ideas. Explore your context.<br>Keep the evidence in view.</p>
<figure><div class="frame"><img src="knowledge-map.png" alt="Actual Synapse map with fictional example data"></div><figcaption>Actual viewer · Fictional example data</figcaption></figure>
<footer><strong>github.com/ranakun/Digital-Synapse</strong><span>Mac + Codex · v2 alpha</span></footer>
</main>
</html>
