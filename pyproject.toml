[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "digital-synapse"
version = "1.0.0"
description = "Local-first digital brain and personal knowledge graph built from canonical Markdown and a disposable SQLite index."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Digital Synapse contributors" }]
keywords = [
  "digital-brain",
  "second-brain",
  "personal-knowledge-base",
  "personal-knowledge-graph",
  "knowledge-graph",
  "markdown",
  "sqlite",
  "local-first",
  "personal-crm",
  "ai-agents",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "markdown-it-py>=3.0.0",
  "pysqlite3-binary>=0.5.4; platform_system != 'Windows'",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
]

[project.optional-dependencies]
ingest = [
  "openai>=1.80.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "vobject>=0.9.9",
  "watchdog>=4.0.0",
]
embeddings = [
  "fastembed>=0.6.0",
  "numpy>=2.0.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[project.scripts]
synapse = "synapse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B017"]
