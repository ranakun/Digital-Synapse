[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "digital-synapse"
version = "2.0.0a1"
description = "Local-first digital brain and personal knowledge graph built from canonical Markdown and a disposable SQLite index."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Digital Synapse contributors" }]
keywords = [
  "digital-brain",
  "second-brain",
  "personal-knowledge-base",
  "personal-knowledge-graph",
  "knowledge-graph",
  "markdown",
  "sqlite",
  "local-first",
  "personal-crm",
  "ai-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "networkx==3.6.1",
  "markdown-it-py>=3.0.0",
  "pysqlite3-binary>=0.5.4; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.2",
  "typer>=0.16.0",
]

[project.optional-dependencies]
ingest = [
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "vobject>=0.9.9",
  "watchdog>=4.0.0",
]
embeddings = [
  "fastembed>=0.6.0",
  "numpy>=2.0.0",
]
mcp = [
  "mcp==1.28.1",
  "anyio>=4.13,<4.14",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[project.scripts]
synapse = "synapse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.hatch.build.targets.wheel.force-include]
"integrations/synapse" = "synapse/integrations"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B017"]
